name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            cmake \
            libgl-dev \
            xorg-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            wayland-protocols \
            libwayland-dev

      - name: Build
        run: |
          meson setup build
          ninja -C build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rl-map-loader-linux
          path: build/rl-map-loader

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-mesa

      - name: Build
        shell: msys2 {0}
        run: |
          meson setup build
          ninja -C build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rl-map-loader-windows
          path: build/rl-map-loader.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            rl-map-loader-linux/rl-map-loader
            rl-map-loader-windows/rl-map-loader.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
