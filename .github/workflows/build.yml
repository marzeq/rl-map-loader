name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      
      - name: Create virtual environment
        run: uv venv
      
      - name: Install dependencies
        run: uv pip install -e ".[dev]"
      
      - name: Build executable
        run: uv run python build.py
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: rl-map-loader-linux
          path: dist/rl-map-loader
      
      - name: Create release asset
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd dist
          tar -czf rl-map-loader-linux.tar.gz rl-map-loader
      
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/rl-map-loader-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install uv
        run: powershell -Command "irm https://astral.sh/uv/install.ps1 | iex"
      
      - name: Create virtual environment
        run: uv venv
      
      - name: Install dependencies
        run: uv pip install -e ".[dev]"
      
      - name: Build executable
        run: uv run python build.py
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rl-map-loader-windows
          path: dist/rl-map-loader.exe
      
      - name: Create release asset
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd dist
          powershell -Command "Compress-Archive -Path rl-map-loader.exe -DestinationPath rl-map-loader-windows.zip"
      
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/rl-map-loader-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
