[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rl-map-loader"
version = "0.1.2"
description = "Application for loading custom Rocket League maps"
readme = "README.md"
requires-python = ">=3.10,<=3.11"
dependencies = [
    "imgui[glfw]>=2.0.0",
    "numpy>=1.21.0",
]

[project.scripts]
rl-map-loader = "rl_map_loader.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rl_map_loader"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "pyinstaller>=6.0",
]
